<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>맛집 리스트</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E85D04">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="맛집리스트">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --primary: #E85D04; --primary-dark: #C04A00; --primary-light: #FFF0E8;
      --bg: #F5F5F5; --card: #FFFFFF; --text: #1A1A1A; --text2: #555;
      --text3: #999; --border: #E8E8E8; --shadow: 0 2px 10px rgba(0,0,0,0.08); --r: 14px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; }
    .header { background: var(--primary); padding: 14px 16px 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(232,93,4,0.35); }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .header h1 { font-size: 18px; font-weight: 700; color: white; }
    .btn-add { background: white; color: var(--primary); border: none; border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-gear { background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.5); color: white; border-radius: 10px; padding: 7px 10px; font-size: 16px; cursor: pointer; }
    .btn-server { background: #FEE500; color: #3A1D1D; border: none; border-radius: 10px; padding: 7px 11px; font-size: 12px; font-weight: 700; cursor: pointer; display: none; }
    .btn-export { background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.5); color: white; border-radius: 10px; padding: 7px 10px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .search-wrap { background: rgba(255,255,255,0.2); border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; }
    .search-wrap input { border: none; outline: none; flex: 1; font-size: 15px; background: transparent; color: white; font-family: inherit; }
    .search-wrap input::placeholder { color: rgba(255,255,255,0.7); }
    .search-wrap .ico { color: rgba(255,255,255,0.8); font-size: 15px; }
    .btn-clear { background: none; border: none; color: rgba(255,255,255,0.8); cursor: pointer; font-size: 16px; padding: 0; display: none; }
    .filter-area { background: white; border-bottom: 1px solid var(--border); }
    .filter-section { padding: 10px 16px; }
    .filter-section + .filter-section { border-top: 1px solid var(--border); padding-top: 8px; }
    .filter-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; padding: 6px 13px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 13px; background: white; cursor: pointer; color: var(--text2); white-space: nowrap; transition: all 0.12s; font-family: inherit; }
    .chip.on { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }
    .region-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .rsel { border: 1.5px solid var(--border); border-radius: 8px; padding: 8px; font-size: 13px; background: white; outline: none; cursor: pointer; font-family: inherit; color: var(--text); }
    .rsel:focus { border-color: var(--primary); }
    .stats { padding: 10px 16px 6px; font-size: 13px; color: var(--text3); }
    .list { padding: 0 12px 80px; display: flex; flex-direction: column; gap: 8px; }
    .card { background: var(--card); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.1s; border: 1px solid var(--border); }
    .card:active { transform: scale(0.98); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .card-name { font-size: 16px; font-weight: 700; flex: 1; line-height: 1.3; }
    .ftag { flex-shrink: 0; margin-left: 8px; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .ft-한식 { background: #FFF3E0; color: #BF360C; }
    .ft-중식 { background: #FCE4EC; color: #B71C1C; }
    .ft-일식 { background: #F3E5F5; color: #6A1B9A; }
    .ft-양식 { background: #E3F2FD; color: #0D47A1; }
    .ft-분식 { background: #E8F5E9; color: #1B5E20; }
    .card-region { font-size: 12px; color: var(--text3); margin-bottom: 4px; }
    .card-addr { font-size: 13px; color: var(--text2); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--bg); color: var(--text2); border: 1px solid var(--border); }
    .empty { text-align: center; padding: 70px 20px; color: var(--text3); }
    .empty .emo { font-size: 52px; margin-bottom: 14px; }
    .empty .t1 { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
    .empty .t2 { font-size: 14px; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: flex-end; justify-content: center; }
    .overlay.open { display: flex; }
    .sheet { background: white; border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; padding: 8px 20px 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); animation: up 0.28s ease; }
    @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .handle { width: 36px; height: 4px; background: #DDD; border-radius: 2px; margin: 8px auto 18px; }
    .sheet-title { font-size: 19px; font-weight: 700; margin-bottom: 18px; }
    .d-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .d-name { font-size: 20px; font-weight: 700; flex: 1; }
    .d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .d-lbl { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
    .d-val { font-size: 15px; font-weight: 500; }
    .d-addr-box { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .d-addr-lbl { font-size: 11px; color: var(--text3); font-weight: 500; margin-bottom: 4px; }
    .d-addr-val { font-size: 14px; line-height: 1.5; }
    .d-memo { background: #FFFDF5; border: 1px solid #F0E8C8; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; color: var(--text2); }
    .btn-kakao { background: #FEE500; color: #3A1D1D; border: none; border-radius: 12px; padding: 14px; width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .btn-phone { background: #E8F5E9; color: #1B5E20; border: 1px solid #C8E6C9; border-radius: 12px; padding: 13px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px; text-decoration: none; }
    .d-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .btn-edit { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-del { background: #FFF0F0; color: #C62828; border: 1.5px solid #FFCDD2; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-close { background: transparent; border: none; color: var(--text3); font-size: 15px; padding: 12px 0 0; width: 100%; cursor: pointer; font-family: inherit; }
    .fg { margin-bottom: 15px; }
    .fl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text2); }
    .fi, .fsel, .fta { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 13px; font-size: 16px; outline: none; font-family: inherit; background: white; color: var(--text); }
    .fi:focus, .fsel:focus, .fta:focus { border-color: var(--primary); }
    .fta { resize: none; }
    .frow3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .toggle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tgl { padding: 12px 8px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; background: white; cursor: pointer; text-align: center; font-family: inherit; color: var(--text2); transition: all 0.12s; }
    .tgl.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .btn-save { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 15px; width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px; font-family: inherit; }
    .btn-cancel { background: transparent; border: none; color: var(--text3); font-size: 15px; padding: 12px 0; width: 100%; cursor: pointer; font-family: inherit; }
    .req { color: var(--primary); }
    .fi.req-f, .fsel.req-f { background: #EEF4FF; border-color: #A8C4FF; }
    .fi.req-f:focus, .fsel.req-f:focus { border-color: #4A90E2; background: white; }
    input[lang="ko"], textarea[lang="ko"] { ime-mode: active; -ms-ime-mode: active; }
    .import-box { background: linear-gradient(135deg,#FFF3E0,#FFF8F3); border: 1.5px solid #FFCC80; border-radius: 12px; padding: 14px; margin-bottom: 18px; }
    .import-title { font-size: 13px; font-weight: 700; color: #E65100; margin-bottom: 8px; }
    .import-row { display: flex; gap: 8px; }
    .btn-import { flex-shrink: 0; background: var(--primary); color: white; border: none; border-radius: 10px; padding: 0 14px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .import-status { font-size: 12px; margin-top: 6px; min-height: 16px; line-height: 1.4; }
    .sett-info { font-size: 12px; color: var(--text3); margin-top: 8px; line-height: 1.8; background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <h1>🍽️ 맛집 리스트</h1>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="btnServer" class="btn-server" onclick="connectServer()">🔗 서버연결</button>
      <button class="btn-export" onclick="exportHTML()" title="내보내기">📥</button>
      <button class="btn-gear" onclick="openSettings()" title="설정">⚙️</button>
      <button class="btn-add" onclick="openAdd()">＋ 추가</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input id="searchInput" type="text" placeholder="식당 이름, 주소 검색..." oninput="onSearch(this.value)">
    <button id="btnClear" class="btn-clear" onclick="clearSearch()">✕</button>
  </div>
</div>

<div class="filter-area">
  <div class="filter-section">
    <div class="filter-scroll" id="foodChips">
      <button class="chip on" onclick="setFood(this,'')">전체</button>
      <button class="chip" onclick="setFood(this,'한식')">🥘 한식</button>
      <button class="chip" onclick="setFood(this,'중식')">🥢 중식</button>
      <button class="chip" onclick="setFood(this,'일식')">🍣 일식</button>
      <button class="chip" onclick="setFood(this,'양식')">🍝 양식</button>
      <button class="chip" onclick="setFood(this,'분식')">🍢 분식</button>
    </div>
  </div>
  <div class="filter-section">
    <div class="filter-scroll">
      <button class="chip" id="chipTable" onclick="toggleChip('tableSeating','chipTable')">🪑 입식만</button>
      <button class="chip" id="chipRoom" onclick="toggleChip('privateRoom','chipRoom')">🚪 단독룸만</button>
      <button class="chip" id="chipRegion" onclick="toggleRegion()">🗺️ 지역 필터</button>
    </div>
  </div>
  <div id="regionArea" style="display:none">
    <div class="filter-section">
      <div class="region-grid">
        <select class="rsel" id="selProv" onchange="onProvChange()"><option value="">도·시 전체</option></select>
        <select class="rsel" id="selCity" onchange="onCityChange()"><option value="">시·군·구 전체</option></select>
        <select class="rsel" id="selDist" onchange="onDistChange()"><option value="">동·읍·면 전체</option></select>
      </div>
    </div>
  </div>
</div>

<div class="stats" id="stats"></div>
<div class="list" id="list"></div>

<div class="overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="sheet" id="detailSheet"></div>
</div>

<div class="overlay" id="formOverlay">
  <div class="sheet" id="formSheet"></div>
</div>

<div class="overlay" id="settOverlay" onclick="closeSett(event)">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title">⚙️ 설정</div>
    <div class="fg">
      <label class="fl">카카오 JavaScript 키</label>
      <input id="settKey" class="fi" placeholder="JavaScript 키 붙여넣기" type="text" autocomplete="off">
      <div class="sett-info">카카오 개발자 콘솔 → 플랫폼 키 → JavaScript 키 복사<br>JavaScript 키 수정 → SDK 도메인에 사용 URL 등록</div>
    </div>
    <button class="btn-save" onclick="saveSettings()">저장</button>
    <hr style="border:none;border-top:1px solid var(--border);margin:16px 0">
    <div class="fg">
      <label class="fl">데이터 내보내기</label>
      <button onclick="exportHTML()" style="background:#EEF2FF;color:#1565C0;border:1.5px solid #C5CAE9;border-radius:12px;padding:13px;width:100%;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">📥 index.html 저장</button>
      <div class="sett-info" style="margin-top:6px">현재 맛집 데이터가 포함된 HTML 파일을 저장합니다.<br>localhost에서는 파일 직접 덮어쓰기, file://에서는 다운로드</div>
    </div>
    <button class="btn-cancel" onclick="closeSettBtn()">닫기</button>
  </div>
</div>

const _st = JSON.parse(localStorage.getItem('matjib_v1') || 'null') || [];
const _stNames = new Set(_st.map(r => r.name));
const _merged = [..._st, ..._emb.filter(r => !_stNames.has(r.name))];
let DB = _merged.length > 0 ? _merged : _emb;
persist();
let _jsKey = '76bbde0cdf2d5aee311796734017f279';  // 카카오 JS API 키 (내보내기 시 자동 저장)
if (!localStorage.getItem('kakao_js_key') && _jsKey) localStorage.setItem('kakao_js_key', _jsKey);
let editId = null;
let formState = {};

const F = { search: '', food: '', tableSeating: false, privateRoom: false, prov: '', city: '', dist: '' };
let showRegion = false;

function persist() { localStorage.setItem('matjib_v1', JSON.stringify(DB)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── FILTER ────────────────────────────────────────────────────────
function filtered() {
  return DB.filter(r => {
    const q = F.search.toLowerCase();
    if (q && !r.name.toLowerCase().includes(q) && !(r.address||'').toLowerCase().includes(q) &&
        !(r.province||'').toLowerCase().includes(q) && !(r.city||'').toLowerCase().includes(q) &&
        !(r.district||'').toLowerCase().includes(q)) return false;
    if (F.food && r.foodType !== F.food) return false;
    if (F.tableSeating && !r.hasTableSeating) return false;
    if (F.privateRoom && !r.hasPrivateRoom) return false;
    if (F.prov && r.province !== F.prov) return false;
    if (F.city && r.city !== F.city) return false;
    if (F.dist && r.district !== F.dist) return false;
    return true;
  });
}

function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort(); }

function buildRegionDropdowns() {
  const provs = uniq(DB.map(r => r.province));
  const cities = uniq(DB.filter(r => !F.prov || r.province === F.prov).map(r => r.city));
  const dists = uniq(DB.filter(r => (!F.prov||r.province===F.prov)&&(!F.city||r.city===F.city)).map(r => r.district));
  document.getElementById('selProv').innerHTML = '<option value="">도·시 전체</option>' + provs.map(v=>`<option value="${esc(v)}" ${F.prov===v?'selected':''}>${esc(v)}</option>`).join('');
  document.getElementById('selCity').innerHTML = '<option value="">시·군·구 전체</option>' + cities.map(v=>`<option value="${esc(v)}" ${F.city===v?'selected':''}>${esc(v)}</option>`).join('');
  document.getElementById('selDist').innerHTML = '<option value="">동·읍·면 전체</option>' + dists.map(v=>`<option value="${esc(v)}" ${F.dist===v?'selected':''}>${esc(v)}</option>`).join('');
}

function onProvChange() { F.prov = document.getElementById('selProv').value; F.city=''; F.dist=''; buildRegionDropdowns(); render(); }
function onCityChange() { F.city = document.getElementById('selCity').value; F.dist=''; buildRegionDropdowns(); render(); }
function onDistChange() { F.dist = document.getElementById('selDist').value; render(); }

function toggleRegion() {
  showRegion = !showRegion;
  document.getElementById('regionArea').style.display = showRegion ? 'block' : 'none';
  document.getElementById('chipRegion').classList.toggle('on', showRegion);
  if (showRegion) buildRegionDropdowns();
  if (!showRegion) { F.prov=''; F.city=''; F.dist=''; render(); }
}

function onSearch(v) { F.search=v; document.getElementById('btnClear').style.display=v?'block':'none'; render(); }
function clearSearch() { F.search=''; document.getElementById('searchInput').value=''; document.getElementById('btnClear').style.display='none'; render(); }
function setFood(btn, v) { F.food=v; document.querySelectorAll('#foodChips .chip').forEach(c=>c.classList.remove('on')); btn.classList.add('on'); render(); }
function toggleChip(key, id) { F[key]=!F[key]; document.getElementById(id).classList.toggle('on',F[key]); render(); }

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  const list = filtered().sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const el = document.getElementById('list');
  document.getElementById('stats').textContent = `총 ${DB.length}개 중 ${list.length}개 표시`;
  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="emo">🔍</div><div class="t1">${DB.length===0?'아직 맛집이 없어요':'검색 결과가 없어요'}</div><div class="t2">${DB.length===0?'오른쪽 위 + 버튼으로 추가해보세요!':'필터를 조정해보세요'}</div></div>`;
    return;
  }
  el.innerHTML = list.map(r => {
    const region = [r.province,r.city,r.district].filter(Boolean).join(' ');
    const badges = [];
    if (r.hasTableSeating) badges.push('🪑 입식'); else badges.push('🍃 좌식');
    if (r.hasPrivateRoom) badges.push('🚪 단독룸');
    if (r.maxCapacity) badges.push(`👥 최대 ${r.maxCapacity}명`);
    return `<div class="card" onclick="openDetail('${r.id}')">
      <div class="card-top"><div class="card-name">${esc(r.name)}</div><span class="ftag ft-${esc(r.foodType)}">${esc(r.foodType)}</span></div>
      ${region?`<div class="card-region">📍 ${esc(region)}</div>`:''}
      ${r.address?`<div class="card-addr">🏠 ${esc(r.address)}</div>`:''}
      <div class="card-badges">${badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

// ── DETAIL ────────────────────────────────────────────────────────
function openDetail(id) {
  const r = DB.find(x=>x.id===id); if (!r) return;
  const region = [r.province,r.city,r.district].filter(Boolean).join(' ');
  const hasNav = r.addressUrl||r.address;
  document.getElementById('detailSheet').innerHTML = `
    <div class="handle"></div>
    <div class="d-head"><div class="d-name">${esc(r.name)}</div><span class="ftag ft-${esc(r.foodType)}" style="font-size:13px;padding:5px 13px">${esc(r.foodType)}</span></div>
    ${region?`<div class="d-addr-box"><div class="d-addr-lbl">지역</div><div class="d-addr-val">📍 ${esc(region)}</div></div>`:''}
    ${r.address?`<div class="d-addr-box"><div class="d-addr-lbl">주소</div><div class="d-addr-val">🏠 ${esc(r.address)}</div></div>`:''}
    <div class="d-grid">
      <div><div class="d-lbl">좌석 형태</div><div class="d-val">${r.hasTableSeating?'🪑 입식':'🍃 좌식'}</div></div>
      <div><div class="d-lbl">단독룸</div><div class="d-val">${r.hasPrivateRoom?'✅ 있음':'❌ 없음'}</div></div>
      ${r.maxCapacity?`<div><div class="d-lbl">최대 수용인원</div><div class="d-val">👥 ${r.maxCapacity}명</div></div>`:''}
    </div>
    ${r.memo?`<div class="d-memo">📝 ${esc(r.memo)}</div>`:''}
    ${r.phone?`<a class="btn-phone" href="tel:${esc(r.phone)}">📞 ${esc(r.phone)} <span style="font-size:12px;opacity:0.7">(유선)</span></a>`:''}
    ${r.mobile?`<a class="btn-phone" href="tel:${esc(r.mobile)}" style="background:#E8F0FE;color:#1565C0;border-color:#C5D5F5">📱 ${esc(r.mobile)} <span style="font-size:12px;opacity:0.7">(휴대폰)</span></a>`:''}
    ${hasNav?`<button class="btn-kakao" onclick="goKakao('${esc(r.address||'')}','${esc(r.addressUrl||'')}')">🗺️ 카카오맵으로 길찾기</button>`:''}
    <div class="d-actions">
      <button class="btn-edit" onclick="closeDetail();openEdit('${r.id}')">✏️ 수정</button>
      <button class="btn-del" onclick="doDelete('${r.id}')">🗑️ 삭제</button>
    </div>
    <button class="btn-close" onclick="closeDetailBtn()">닫기</button>`;
  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDetail(e) { if (!e||e.target===document.getElementById('detailOverlay')) { document.getElementById('detailOverlay').classList.remove('open'); document.body.style.overflow=''; } }
function closeDetailBtn() { document.getElementById('detailOverlay').classList.remove('open'); document.body.style.overflow=''; }
function goKakao(addr, url) { if (url&&url.startsWith('http')) window.open(url,'_blank'); else if (addr) window.open('https://map.kakao.com/?q='+encodeURIComponent(addr),'_blank'); }
function doDelete(id) {
  if (!confirm('이 맛집을 삭제할까요?')) return;
  DB = DB.filter(r=>r.id!==id); persist(); closeDetailBtn();
  if (showRegion) buildRegionDropdowns(); render();
}

// ── FORM ──────────────────────────────────────────────────────────
function openAdd() {
  editId=null; formState={tableSeating:true,privateRoom:false}; buildForm(null);

    <div class="fg"><label class="fl">단독룸 여부</label><div class="toggle-row">
      <button class="tgl ${formState.privateRoom?'on':''}" id="rmY" onclick="setTgl('room',true)">✅ 있음</button>
      <button class="tgl ${!formState.privateRoom?'on':''}" id="rmN" onclick="setTgl('room',false)">❌ 없음</button>
    </div></div>
    <div class="fg"><label class="fl">최대 수용 인원</label><input id="fCap" class="fi" type="number" inputmode="numeric" placeholder="명 (숫자만)" min="1" max="9999" value="${r?.maxCapacity||''}"></div>
    <div class="fg"><label class="fl">메모</label><textarea id="fMemo" class="fta" lang="ko" rows="3" placeholder="추천 메뉴, 주차, 특이사항 등...">${esc(r?.memo||'')}</textarea></div>
    <button class="btn-save" onclick="submitForm()">${isEdit?'수정 완료':'추가하기'}</button>
    <button class="btn-cancel" onclick="closeFormBtn()">취소</button>`;
}

function setTgl(type, val) {
  if (type==='table') { formState.tableSeating=val; document.getElementById('tblY').classList.toggle('on',val); document.getElementById('tblN').classList.toggle('on',!val); }
  else { formState.privateRoom=val; document.getElementById('rmY').classList.toggle('on',val); document.getElementById('rmN').classList.toggle('on',!val); }
}

function submitForm() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('식당 이름을 입력해주세요.'); return; }

  // 중복 체크 (신규 추가 시)
  if (!editId) {
    const dup = DB.find(r => r.name === name);
    if (dup) {
      const region = [dup.province, dup.city, dup.district].filter(Boolean).join(' ');
      const addr = dup.address ? '\n주소: ' + dup.address : '';
      if (!confirm(`"${name}"이(가) 이미 등록되어 있어요.\n${region ? '지역: ' + region : ''}${addr}\n\n그래도 추가하시겠어요?`)) return;
    }
  }
  const data = {
    id: editId||uid(), name,
    foodType: document.getElementById('fFood').value,
    province: document.getElementById('fProv').value.trim(),
    city: document.getElementById('fCity').value.trim(),
    district: document.getElementById('fDist').value.trim(),
    address: document.getElementById('fAddr').value.trim(),
    addressUrl: document.getElementById('fUrl').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    mobile: document.getElementById('fMobile').value.trim(),
    hasTableSeating: formState.tableSeating,
    hasPrivateRoom: formState.privateRoom,
    maxCapacity: parseInt(document.getElementById('fCap').value)||0,
    memo: document.getElementById('fMemo').value.trim(),
  };
  if (editId) { const idx=DB.findIndex(r=>r.id===editId); DB[idx]=data; }
  else DB.push(data);
  persist(); closeFormBtn();
  if (showRegion) buildRegionDropdowns(); render();
}

// ── SETTINGS ──────────────────────────────────────────────────────
function openSettings() { document.getElementById('settKey').value=localStorage.getItem('kakao_js_key')||''; document.getElementById('settOverlay').classList.add('open'); document.body.style.overflow='hidden'; }
function closeSett(e) { if (!e||e.target===document.getElementById('settOverlay')) closeSettBtn(); }
function closeSettBtn() { document.getElementById('settOverlay').classList.remove('open'); document.body.style.overflow=''; }
function saveSettings() {
  const key=document.getElementById('settKey').value.trim();
  localStorage.setItem('kakao_js_key',key); _jsKey=key;
  sdkReady=false; sdkPromise=null; closeSettBtn();
  alert(key?'✅ JavaScript 키가 저장됐어요! 내보내기 하면 파일에도 저장됩니다.':'🗑️ API 키가 삭제됐어요.');
}

// ── KAKAO SDK ─────────────────────────────────────────────────────
let sdkReady=false, sdkPromise=null;
function loadSdk() {
  const key=localStorage.getItem('kakao_js_key')||'';
  if (!key) return Promise.reject(new Error('no_key'));
  if (sdkReady) return Promise.resolve();
  if (sdkPromise) return sdkPromise;
  sdkPromise = new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
    s.onload=()=>kakao.maps.load(()=>{sdkReady=true;res();});
    s.onerror=()=>{sdkPromise=null;rej(new Error('SDK 로드 실패'));};
    document.head.appendChild(s);
  });
  return sdkPromise;
}

// ── URL PARSE ─────────────────────────────────────────────────────
function parseKakaoUrl(url) {
  url=(url||'').trim();
  const m=url.match(/link\/map\/(.+?),([\d.]+),([\d.]+)/);
  if (m) return {name:decodeURIComponent(m[1].replace(/\+/g,' ')),lat:+m[2],lng:+m[3]};
  const p=url.match(/place\.map\.kakao\.com\/(\d+)/);
  if (p) return {placeId:p[1]};
  return null;
}

// ── IMPORT ────────────────────────────────────────────────────────
async function importUrl() {
  const urlVal=(document.getElementById('fUrl').value||'').trim();
  const stEl=document.getElementById('importStatus');
  const st=(msg,color)=>{stEl.textContent=msg;stEl.style.color=color;};
  if (!urlVal){st('⚠️ URL을 먼저 붙여넣어 주세요.','#C62828');return;}
  const parsed=parseKakaoUrl(urlVal);
  if (!parsed){st('⚠️ 카카오맵 URL이 아닌 것 같아요.','#C62828');return;}
  if (parsed.name) document.getElementById('fName').value=parsed.name;
  st('🔍 정보 가져오는 중...','#666');
  const jsKey=localStorage.getItem('kakao_js_key')||'';
  if (jsKey) {
    let name=parsed.name||document.getElementById('fName').value.trim();
    if (!name&&parsed.placeId) { st('🔍 장소 정보 가져오는 중...','#666'); const info=await getPlaceInfoFromProxy(parsed.placeId); if (info?.name){name=info.name;document.getElementById('fName').value=name;} document.getElementById('fUrl').value=`https://place.map.kakao.com/${parsed.placeId}`; }
    if (name) {
      st('🔍 카카오맵에서 검색 중...','#666');
      try {
        await loadSdk();
        const ps=new kakao.maps.services.Places();
        const opts={};
        if (parsed.lat&&parsed.lng){opts.location=new kakao.maps.LatLng(parsed.lat,parsed.lng);opts.radius=300;opts.sort=kakao.maps.services.SortBy.DISTANCE;}
        ps.keywordSearch(name,(results,status)=>{
          if (status!==kakao.maps.services.Status.OK||!results.length){st('⚠️ 검색 결과 없어요. 이름을 직접 수정 후 다시 눌러주세요.','#E65100');return;}
          const p=results[0];
          if (p.place_name) document.getElementById('fName').value=p.place_name;
          const addr=p.road_address_name||p.address_name;
          if (addr) document.getElementById('fAddr').value=addr;
          if (p.phone) document.getElementById('fPhone').value=p.phone;
          if (p.place_url) document.getElementById('fUrl').value=p.place_url;
          const ft=mapCat(p.category_name); if (ft) document.getElementById('fFood').value=ft;
          if (p.address_name){const{prov,city,dist}=splitAddr(p.address_name);if(prov)document.getElementById('fProv').value=prov;if(city)document.getElementById('fCity').value=city;if(dist)document.getElementById('fDist').value=dist;}
          st(`✅ "${p.place_name}" 정보를 불러왔어요!`,'#2E7D32');
        },opts);
      } catch(e){st('❌ '+e.message+' — JavaScript 키와 도메인 등록을 확인해주세요.','#C62828');}
    } else {
      document.getElementById('fUrl').value=`https://place.map.kakao.com/${parsed.placeId||''}`;
      st('⚠️ 이름을 찾지 못했어요. 식당 이름을 직접 입력 후 다시 눌러주세요.','#E65100');
      document.getElementById('fName').focus();
    }
    return;
  }
  if (parsed.placeId){document.getElementById('fUrl').value=`https://place.map.kakao.com/${parsed.placeId}`;st('⚠️ URL 저장됨. ⚙️ 설정에서 카카오 JavaScript 키를 등록하면 자동입력 가능해요.','#E65100');}
  else if (parsed.name) st('✅ 이름을 URL에서 추출했어요. 나머지는 직접 입력해주세요.','#2E7D32');
}

async function getPlaceInfoFromProxy(placeId) {
  const target=`https://place.map.kakao.com/${placeId}`;
  const proxies=[
    {url:`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`,raw:true},
    {url:`https://corsproxy.io/?${encodeURIComponent(target)}`,raw:true},
    {url:`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`,raw:false},
  ];
  for (const p of proxies) {
    try {
      const res=await fetch(p.url,{signal:AbortSignal.timeout(8000)});
      if (!res.ok) continue;
      const html=p.raw?await res.text():(await res.json()).contents||'';
      if (!html||html.length<100) continue;
      const doc=new DOMParser().parseFromString(html,'text/html');
      const r={};
      const ogTitle=doc.querySelector('meta[property="og:title"]')?.getAttribute('content')||'';
      r.name=ogTitle.replace(/\s*[·:\-]\s*카카오맵.*/i,'').trim();
      if (!r.name) r.name=(doc.querySelector('title')?.textContent||'').replace(/\s*[·:\-]\s*카카오맵.*/i,'').trim();
      const desc=doc.querySelector('meta[property="og:description"]')?.getAttribute('content')||'';
      if (desc){const addrPart=desc.split('·')[0].trim();if(addrPart&&addrPart.length>4)r.address=addrPart;}
      for (const s of doc.querySelectorAll('script')){
        const t=s.textContent||''; if (t.length<10) continue;
        if (!r.name){const m=t.match(/"(?:place_name|placeName)"\s*:\s*"([^"]+)"/);if(m)r.name=m[1];}
        if (!r.phone){const m=t.match(/"(?:phone|tel|telephone)"\s*:\s*"([^"]+)"/);if(m)r.phone=m[1];}
        if (!r.address){const m=t.match(/"road_address_name"\s*:\s*"([^"]+)"/);if(m)r.address=m[1];}
        if (!r.address){const m=t.match(/"address_name"\s*:\s*"([^"]+)"/);if(m)r.address=m[1];}
        if (!r.category){const m=t.match(/"category_name"\s*:\s*"([^"]+)"/);if(m)r.category=m[1];}
      }
      if (!r.phone){const m=html.match(/\b(0\d{1,2}-\d{3,4}-\d{4})\b/);if(m)r.phone=m[1];}
      if (r.name) return r;
    } catch {continue;}
  }
  return null;
}

function mapCat(c) {
  c=c||'';
  if (/한식|국밥|설렁탕|삼겹살|갈비|불고기|한정식|찌개|순두부|비빔|백반|쌈/.test(c)) return '한식';
  if (/중식|중국|짜장|짬뽕|탕수육|마라/.test(c)) return '중식';
  if (/일식|스시|초밥|라멘|우동|소바|돈까스|돈가스|이자카야|야키토리/.test(c)) return '일식';
  if (/양식|이탈리아|피자|파스타|스테이크|버거|패밀리레스토랑|서양|프랑스/.test(c)) return '양식';
  if (/분식|떡볶이|김밥|순대|포장마차|튀김/.test(c)) return '분식';
  return '';
}

function splitAddr(addr) {
  const abbr={'서울':'서울특별시','부산':'부산광역시','대구':'대구광역시','인천':'인천광역시','광주':'광주광역시','대전':'대전광역시','울산':'울산광역시','세종':'세종특별자치시','경기':'경기도','강원':'강원도','충북':'충청북도','충남':'충청남도','전북':'전라북도','전남':'전라남도','경북':'경상북도','경남':'경상남도','제주':'제주도'};
  const parts=addr.split(' ').filter(Boolean);
  let prov='',city='',dist='';
  for (let i=0;i<parts.length;i++){
    const p=parts[i];
    if (!prov&&abbr[p]){prov=abbr[p];continue;}
    if (!prov&&/특별시$|광역시$|특별자치시$|도$|특별자치도$/.test(p)){prov=p;continue;}
    if (prov&&!city&&/시$|군$|구$/.test(p)){city=p;continue;}
    if (city&&/구$/.test(p)){dist=p;continue;}
    if (city&&/동$|읍$|면$/.test(p)){dist=p;break;}
  }
  return {prov,city,dist};
}

// ── 전화번호 포맷 ──────────────────────────────────────────────────
function fmtPhone(el) {
  const n=el.value.replace(/\D/g,'').slice(0,11); let r='';
  if (n.startsWith('02')){if(n.length<=2)r=n;else if(n.length<=5)r=n.slice(0,2)+'-'+n.slice(2);else if(n.length<=9)r=n.slice(0,2)+'-'+n.slice(2,5)+'-'+n.slice(5);else r=n.slice(0,2)+'-'+n.slice(2,6)+'-'+n.slice(6);}
  else if (n.startsWith('010')){if(n.length<=3)r=n;else if(n.length<=7)r=n.slice(0,3)+'-'+n.slice(3);else r=n.slice(0,3)+'-'+n.slice(3,7)+'-'+n.slice(7);}
  else{if(n.length<=3)r=n;else if(n.length<=6)r=n.slice(0,3)+'-'+n.slice(3);else if(n.length<=10)r=n.slice(0,3)+'-'+n.slice(3,6)+'-'+n.slice(6);else r=n.slice(0,3)+'-'+n.slice(3,7)+'-'+n.slice(7);}
  el.value=r;
}

// ── 내보내기 ──────────────────────────────────────────────────────
async function exportHTML() {
  const currentDB=JSON.parse(localStorage.getItem('matjib_v1')||'null')||DB;
  if (!confirm(`현재 저장된 맛집 ${currentDB.length}개를 파일에 포함해서 저장합니다.\n계속하시겠어요?`)) return;
  try {
    let html;
    try { const res=await fetch('./index.html?v='+Date.now(),{cache:'no-cache'}); if(res.ok) html=await res.text(); } catch {}
    if (!html) html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    const dataStr=JSON.stringify(currentDB);
    const currentKey=localStorage.getItem('kakao_js_key')||_jsKey||'';
    let replaced=html.replace(/let _jsKey = '[^']*';/,`let _jsKey = '${currentKey}';`);
    replaced=replaced.replace(/const _emb = \[[\s\S]*?\];/,`const _emb = ${dataStr};`);
    replaced=replaced.replace(/let DB = (?:JSON\.parse\(localStorage\.getItem\('matjib_v1'\) \|\| 'null'\) \|\| )?\[[\s\S]*?\];/,`let DB = ${dataStr};`);

    // localhost에서 실행 중이면 서버에 직접 저장
    if (window.location.hostname==='localhost') {
      try {
        const res=await fetch('/save',{method:'POST',body:replaced,headers:{'Content-Type':'text/html'}});
        const json=await res.json();
        if (json.ok){alert(`✅ 저장 완료! 맛집 ${currentDB.length}개 데이터가 index.html에 저장됐어요.`);return;}
      } catch {}
    }
    // file://에서 다운로드 폴백
    const blob=new Blob([replaced],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='index.html'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alert(`✅ 완료! 맛집 ${currentDB.length}개 데이터가 포함된 index.html 다운로드됐어요.`);
  } catch(e){alert('❌ '+e.message);}
}

// ── 서버 연결 ──────────────────────────────────────────────────────
function connectServer() {
  const btn = document.getElementById('btnServer');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '🔄 시작 중...';

  // 서버가 이미 실행 중이면 바로 이동
  fetch('http://localhost:8787/', {signal: AbortSignal.timeout(2000)})
    .then(() => { window.location.href = 'http://localhost:8787'; })
    .catch(() => {
      // 서버 없음 → 프로토콜로 자동 시작
      const a = document.createElement('a');
      a.href = 'matjip://start';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      let attempts = 0;
      const timer = setInterval(() => {
        attempts++;
        if (attempts === 3) btn.innerHTML = '👆 Chrome "열기" 클릭!';
        else btn.innerHTML = `⏳ 서버 대기... (${attempts * 3}초)`;

        fetch('http://localhost:8787/', {signal: AbortSignal.timeout(2000)})
          .then(() => {
            clearInterval(timer);
            window.location.href = 'http://localhost:8787';
          })
          .catch(() => {
            if (attempts >= 20) {
              clearInterval(timer);
              alert('서버 시작 실패.\nregister.bat을 먼저 실행하세요.');
              btn.disabled = false;
              btn.innerHTML = orig;
            }
          });
      }, 3000);
    });
}

(function() {

    if (!hint) {
      hint = document.createElement('div');
      hint.style.position = 'fixed';
      hint.style.bottom = '24px';
      hint.style.left = '50%';
      hint.style.transform = 'translateX(-50%)';
      hint.style.padding = '8px 20px';
      hint.style.borderRadius = '20px';
      hint.style.fontSize = '13px';
      hint.style.fontWeight = '600';
      hint.style.zIndex = '9999';
      hint.style.pointerEvents = 'none';
      hint.style.whiteSpace = 'nowrap';
      hint.style.boxShadow = '0 2px 10px rgba(0,0,0,0.25)';
      hint.style.display = 'none';
      hint.style.color = 'white';
      document.body.appendChild(hint);
    }
    return hint;
  }
  document.addEventListener('focusin', e => {
    const el = e.target;
    if (el.getAttribute('lang') === 'ko' || el.lang === 'ko') {
      const h = getHint();
      h.textContent = '⌨️ 한글 입력 확인 (한/영 키)';
      h.style.background = '#444';
      h.style.display = 'block';
    } else {
      if (hint) hint.style.display = 'none';
    }
  });
  document.addEventListener('focusout', () => {
    setTimeout(() => { if (hint) hint.style.display = 'none'; }, 200);
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.getAttribute('lang') !== 'ko' && el.lang !== 'ko') return;
    const h = getHint();
    if (/[a-zA-Z]/.test(el.value)) {
      h.textContent = '⚠️ 영문 입력 중! 한/영 키를 눌러주세요';
      h.style.background = '#C62828';
      h.style.display = 'block';
    } else {
      h.textContent = '⌨️ 한글 입력 확인 (한/영 키)';
      h.style.background = '#444';
    }
  });
})();
