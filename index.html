
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>맛집 리스트</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E85D04">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="맛집리스트">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --primary: #E85D04;
      --primary-dark: #C04A00;
      --primary-light: #FFF0E8;
      --bg: #F5F5F5;
      --card: #FFFFFF;
      --text: #1A1A1A;
      --text2: #555;
      --text3: #999;
      --border: #E8E8E8;
      --shadow: 0 2px 10px rgba(0,0,0,0.08);
      --r: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--primary);
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(232,93,4,0.35);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 19px; font-weight: 700; color: white; }
    .btn-add {
      background: white;
      color: var(--primary);
      border: none;
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .search-wrap {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-wrap input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 15px;
      background: transparent;
      color: white;
      font-family: inherit;
    }
    .search-wrap input::placeholder { color: rgba(255,255,255,0.7); }
    .search-wrap .ico { color: rgba(255,255,255,0.8); font-size: 15px; }
    .btn-clear { background: none; border: none; color: rgba(255,255,255,0.8); cursor: pointer; font-size: 16px; padding: 0; display: none; }

    /* ===== FILTERS ===== */
    .filter-area { background: white; border-bottom: 1px solid var(--border); }
    .filter-section { padding: 10px 16px; }
    .filter-section + .filter-section { border-top: 1px solid var(--border); padding-top: 8px; }
    .filter-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 6px 13px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      background: white;
      cursor: pointer;
      color: var(--text2);
      white-space: nowrap;
      transition: all 0.12s;
      font-family: inherit;
    }
    .chip.on { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }
    .region-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .rsel {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 8px 8px;
      font-size: 13px;
      background: white;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
    }
    .rsel:focus { border-color: var(--primary); }

    /* ===== STATS ===== */
    .stats { padding: 10px 16px 6px; font-size: 13px; color: var(--text3); }

    /* ===== LIST ===== */
    .list { padding: 0 12px 80px; display: flex; flex-direction: column; gap: 8px; }

    /* ===== CARD ===== */
    .card {
      background: var(--card);
      border-radius: var(--r);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.1s;
      border: 1px solid var(--border);
    }
    .card:active { transform: scale(0.98); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .card-name { font-size: 16px; font-weight: 700; flex: 1; line-height: 1.3; }
    .ftag {
      flex-shrink: 0;
      margin-left: 8px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .ft-한식 { background: #FFF3E0; color: #BF360C; }
    .ft-중식 { background: #FCE4EC; color: #B71C1C; }
    .ft-일식 { background: #F3E5F5; color: #6A1B9A; }
    .ft-양식 { background: #E3F2FD; color: #0D47A1; }
    .ft-분식 { background: #E8F5E9; color: #1B5E20; }
    .card-region { font-size: 12px; color: var(--text3); margin-bottom: 4px; }
    .card-addr { font-size: 13px; color: var(--text2); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--text2);
      border: 1px solid var(--border);
    }

    /* ===== EMPTY ===== */
    .empty { text-align: center; padding: 70px 20px; color: var(--text3); }
    .empty .emo { font-size: 52px; margin-bottom: 14px; }
    .empty .t1 { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
    .empty .t2 { font-size: 14px; }

    /* ===== MODAL ===== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .sheet {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 8px 20px 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      animation: up 0.28s ease;
    }
    @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .handle { width: 36px; height: 4px; background: #DDD; border-radius: 2px; margin: 8px auto 18px; }
    .sheet-title { font-size: 19px; font-weight: 700; margin-bottom: 18px; }

    /* ===== DETAIL ===== */
    .d-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .d-name { font-size: 20px; font-weight: 700; flex: 1; }
    .d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .d-item { }
    .d-lbl { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
    .d-val { font-size: 15px; font-weight: 500; }
    .d-addr-box { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
    .d-addr-lbl { font-size: 11px; color: var(--text3); font-weight: 500; margin-bottom: 4px; }
    .d-addr-val { font-size: 14px; line-height: 1.5; }
    .d-memo { background: #FFFDF5; border: 1px solid #F0E8C8; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; color: var(--text2); }
    .btn-kakao {
      background: #FEE500;
      color: #3A1D1D;
      border: none;
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-phone {
      background: #E8F5E9;
      color: #1B5E20;
      border: 1px solid #C8E6C9;
      border-radius: 12px;
      padding: 13px;
      width: 100%;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
      text-decoration: none;
    }
    .d-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .btn-edit {
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-del {
      background: #FFF0F0;
      color: #C62828;
      border: 1.5px solid #FFCDD2;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text3);
      font-size: 15px;
      padding: 12px 0 0;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
    }

    /* ===== FORM ===== */
    .fg { margin-bottom: 15px; }
    .fl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text2); }
    .fi, .fsel, .fta {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
      background: white;
      color: var(--text);
    }
    .fi:focus, .fsel:focus, .fta:focus { border-color: var(--primary); }
    .fta { resize: none; }
    .frow3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .frow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toggle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tgl {
      padding: 12px 8px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: white;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      color: var(--text2);
      transition: all 0.12s;
    }
    .tgl.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .btn-save {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      font-family: inherit;
    }
    .btn-cancel {
      background: transparent;
      border: none;
      color: var(--text3);
      font-size: 15px;
      padding: 12px 0;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
    }
    .req { color: var(--primary); }
    .fi.req-f, .fsel.req-f {
      background: #EEF4FF;
      border-color: #A8C4FF;
    }
    .fi.req-f:focus, .fsel.req-f:focus {
      border-color: #4A90E2;
      background: white;
    }
    input[lang="ko"], textarea[lang="ko"] {
      ime-mode: active;
      -ms-ime-mode: active;
    }
    .btn-gear {
      background: rgba(255,255,255,0.2);
      border: 1.5px solid rgba(255,255,255,0.5);
      color: white;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .import-box {
      background: linear-gradient(135deg,#FFF3E0,#FFF8F3);
      border: 1.5px solid #FFCC80;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }
    .import-title { font-size: 13px; font-weight: 700; color: #E65100; margin-bottom: 8px; }
    .import-row { display: flex; gap: 8px; }
    .btn-import {
      flex-shrink: 0;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }
    .import-status { font-size: 12px; margin-top: 6px; min-height: 16px; line-height: 1.4; }
    .sett-info {
      font-size: 12px;
      color: var(--text3);
      margin-top: 8px;
      line-height: 1.8;
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 12px;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-row">
    <h1>🍽️ 맛집 리스트</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn-gear" onclick="openSettings()" title="설정">⚙️</button>
      <button class="btn-add" onclick="openAdd()">＋ 추가</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input id="searchInput" type="text" placeholder="식당 이름, 주소 검색..." oninput="onSearch(this.value)">
    <button id="btnClear" class="btn-clear" onclick="clearSearch()">✕</button>
  </div>
</div>

<!-- FILTERS -->
<div class="filter-area">
  <div class="filter-section">
    <div class="filter-scroll" id="foodChips">
      <button class="chip on" data-v="" onclick="setFood(this,'')">전체</button>
      <button class="chip" data-v="한식" onclick="setFood(this,'한식')">🥘 한식</button>
      <button class="chip" data-v="중식" onclick="setFood(this,'중식')">🥢 중식</button>
      <button class="chip" data-v="일식" onclick="setFood(this,'일식')">🍣 일식</button>
      <button class="chip" data-v="양식" onclick="setFood(this,'양식')">🍝 양식</button>
      <button class="chip" data-v="분식" onclick="setFood(this,'분식')">🍢 분식</button>
    </div>
  </div>
  <div class="filter-section">
    <div class="filter-scroll">
      <button class="chip" id="chipTable" onclick="toggleChip('tableSeating','chipTable')">🪑 입식만</button>
      <button class="chip" id="chipRoom" onclick="toggleChip('privateRoom','chipRoom')">🚪 단독룸만</button>
      <button class="chip" id="chipRegion" onclick="toggleRegion()">🗺️ 지역 필터</button>
    </div>
  </div>
  <div id="regionArea" style="display:none">
    <div class="filter-section">
      <div class="region-grid">
        <select class="rsel" id="selProv" onchange="onProvChange()"><option value="">도·시 전체</option></select>
        <select class="rsel" id="selCity" onchange="onCityChange()"><option value="">시·군·구 전체</option></select>
        <select class="rsel" id="selDist" onchange="onDistChange()"><option value="">동·읍·면 전체</option></select>
      </div>
    </div>
  </div>
</div>

<!-- STATS -->
<div class="stats" id="stats"></div>

<!-- LIST -->
<div class="list" id="list"></div>

<!-- DETAIL MODAL -->
<div class="overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="sheet" id="detailSheet"></div>
</div>

<!-- FORM MODAL -->
<div class="overlay" id="formOverlay">
  <div class="sheet" id="formSheet"></div>
</div>

<!-- SETTINGS MODAL -->
<div class="overlay" id="settOverlay" onclick="closeSett(event)">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheet-title">⚙️ 설정</div>
    <div class="fg">
      <label class="fl">카카오 JavaScript API 키</label>
      <input id="settKey" class="fi" placeholder="JavaScript 앱 키를 입력하세요" type="text" autocomplete="off">
      <div class="sett-info">
        카카오맵 URL 자동입력 기능에 사용됩니다.<br>
        1. <a href="https://developers.kakao.com" target="_blank" style="color:var(--primary)">developers.kakao.com</a> → 내 애플리케이션 → 앱 만들기<br>
        2. 앱 키 → <strong>JavaScript 키</strong> 복사 후 위에 입력<br>
        3. 플랫폼 → Web → 사이트 도메인에 배포 URL 등록<br>
        &nbsp;&nbsp;&nbsp;(예: https://내앱.netlify.app)
      </div>
    </div>
    <button class="btn-save" onclick="saveSettings()">저장</button>
    <hr style="border:none;border-top:1px solid var(--border);margin:16px 0">
    <div class="fg">
      <label class="fl">데이터 내보내기</label>
      <button onclick="exportHTML()" style="background:#EEF2FF;color:#1565C0;border:1.5px solid #C5CAE9;border-radius:12px;padding:13px;width:100%;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">
        📥 index.html 다운로드
      </button>
      <div class="sett-info" style="margin-top:6px">현재 맛집 데이터가 포함된 HTML 파일을 다운로드합니다.<br>이 파일을 서버에 올리면 데이터가 반영됩니다.</div>
    </div>
    <button class="btn-cancel" onclick="closeSettBtn()">닫기</button>
  </div>
</div>

// ── FILTER ────────────────────────────────────────────────────────
function filtered() {
  return DB.filter(r => {
    const q = F.search.toLowerCase();
    if (q && !r.name.toLowerCase().includes(q) &&
        !(r.address||'').toLowerCase().includes(q) &&
        !(r.province||'').toLowerCase().includes(q) &&
        !(r.city||'').toLowerCase().includes(q) &&
        !(r.district||'').toLowerCase().includes(q)) return false;
    if (F.food && r.foodType !== F.food) return false;
    if (F.tableSeating && !r.hasTableSeating) return false;
    if (F.privateRoom && !r.hasPrivateRoom) return false;
    if (F.prov && r.province !== F.prov) return false;
    if (F.city && r.city !== F.city) return false;
    if (F.dist && r.district !== F.dist) return false;
    return true;
  });
}

// ── REGION DROPDOWNS ──────────────────────────────────────────────
function uniq(arr) { return [...new Set(arr.filter(Boolean))].sort(); }

function buildRegionDropdowns() {
  const provs = uniq(DB.map(r => r.province));
  const cities = uniq(DB.filter(r => !F.prov || r.province === F.prov).map(r => r.city));
  const dists = uniq(DB.filter(r =>
    (!F.prov || r.province === F.prov) && (!F.city || r.city === F.city)
  ).map(r => r.district));

  const sp = document.getElementById('selProv');
  const sc = document.getElementById('selCity');
  const sd = document.getElementById('selDist');

  sp.innerHTML = '<option value="">도·시 전체</option>' + provs.map(v =>
    `<option value="${esc(v)}" ${F.prov===v?'selected':''}>${esc(v)}</option>`).join('');
  sc.innerHTML = '<option value="">시·군·구 전체</option>' + cities.map(v =>
    `<option value="${esc(v)}" ${F.city===v?'selected':''}>${esc(v)}</option>`).join('');
  sd.innerHTML = '<option value="">동·읍·면 전체</option>' + dists.map(v =>
    `<option value="${esc(v)}" ${F.dist===v?'selected':''}>${esc(v)}</option>`).join('');
}

function onProvChange() {
  F.prov = document.getElementById('selProv').value;
  F.city = ''; F.dist = '';
  buildRegionDropdowns(); render();
}
function onCityChange() {
  F.city = document.getElementById('selCity').value;
  F.dist = '';
  buildRegionDropdowns(); render();
}
function onDistChange() {
  F.dist = document.getElementById('selDist').value;
  render();
}

function toggleRegion() {
  showRegion = !showRegion;
  document.getElementById('regionArea').style.display = showRegion ? 'block' : 'none';
  document.getElementById('chipRegion').classList.toggle('on', showRegion);
  if (showRegion) buildRegionDropdowns();
  if (!showRegion) { F.prov=''; F.city=''; F.dist=''; render(); }
}

// ── FILTER HANDLERS ───────────────────────────────────────────────
function onSearch(v) {
  F.search = v;
  document.getElementById('btnClear').style.display = v ? 'block' : 'none';
  render();
}
function clearSearch() {
  F.search = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('btnClear').style.display = 'none';
  render();
}
function setFood(btn, v) {
  F.food = v;
  document.querySelectorAll('#foodChips .chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function toggleChip(key, id) {
  F[key] = !F[key];
  document.getElementById(id).classList.toggle('on', F[key]);
  render();
}

// ── RENDER LIST ───────────────────────────────────────────────────
function render() {
  const list = filtered().sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  const el = document.getElementById('list');
  document.getElementById('stats').textContent = `총 ${DB.length}개 중 ${list.length}개 표시`;

  if (list.length === 0) {
    el.innerHTML = `<div class="empty">
      <div class="emo">🔍</div>
      <div class="t1">${DB.length===0 ? '아직 맛집이 없어요' : '검색 결과가 없어요'}</div>
      <div class="t2">${DB.length===0 ? '오른쪽 위 + 버튼으로 추가해보세요!' : '필터를 조정해보세요'}</div>
    </div>`;
    return;
  }

  el.innerHTML = list.map(r => {
    const region = [r.province, r.city, r.district].filter(Boolean).join(' ');
    const badges = [];
    if (r.hasTableSeating) badges.push('🪑 입식');
    else badges.push('🍃 좌식');
    if (r.hasPrivateRoom) badges.push('🚪 단독룸');
    if (r.maxCapacity) badges.push(`👥 최대 ${r.maxCapacity}명`);
    return `
      <div class="card" onclick="openDetail('${r.id}')">
        <div class="card-top">
          <div class="card-name">${esc(r.name)}</div>
          <span class="ftag ft-${esc(r.foodType)}">${esc(r.foodType)}</span>
        </div>
        ${region ? `<div class="card-region">📍 ${esc(region)}</div>` : ''}
        ${r.address ? `<div class="card-addr">🏠 ${esc(r.address)}</div>` : ''}
        <div class="card-badges">${badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>
      </div>`;
  }).join('');
}

function goKakao(addr, url) {

function doDelete(id) {

  if (showRegion) buildRegionDropdowns();
  render();
}

        카카오맵 앱 → 장소 검색 → 공유 → 링크 복사 후 붙여넣기
      </div>
    </div>

    <div class="fg">
      <label class="fl">식당 이름 <span class="req">*</span></label>
      <input id="fName" class="fi req-f" lang="ko" placeholder="예: 할머니 손칼국수" value="${esc(r?.name||'')}">
    </div>

    <div class="fg">
      <label class="fl">음식 종류 <span class="req">*</span></label>
      <select id="fFood" class="fsel req-f">
        ${foodOpts.map(t=>`<option value="${t}" ${r?.foodType===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>

    <div class="fg">
      <label class="fl">지역</label>
      <div class="frow3">
        <input id="fProv" class="fi req-f" lang="ko" placeholder="도·시" value="${esc(r?.province||'')}" list="dl-prov" autocomplete="off">
        <input id="fCity" class="fi req-f" lang="ko" placeholder="시·군·구" value="${esc(r?.city||'')}" list="dl-city" autocomplete="off">
        <input id="fDist" class="fi req-f" lang="ko" placeholder="동·읍·면" value="${esc(r?.district||'')}" list="dl-dist" autocomplete="off">
        <datalist id="dl-prov">${[...new Set(DB.map(r=>r.province).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
        <datalist id="dl-city">${[...new Set(DB.map(r=>r.city).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
        <datalist id="dl-dist">${[...new Set(DB.map(r=>r.district).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
      </div>
    </div>

    <div class="fg">
      <label class="fl">주소</label>
      <input id="fAddr" class="fi req-f" lang="ko" placeholder="예: 서울 강남구 역삼동 123-4" value="${esc(r?.address||'')}">
    </div>

    <div class="fg">
      <label class="fl">전화번호 <span style="font-weight:400;color:var(--text3);font-size:12px">(유선)</span></label>
      <input id="fPhone" class="fi req-f" type="tel" placeholder="0431234567 (하이픈 없이)" value="${esc(r?.phone||'')}" oninput="fmtPhone(this)">
    </div>

    <div class="fg">
      <label class="fl">휴대폰 번호 <span style="font-weight:400;color:var(--text3);font-size:12px">(수기 입력)</span></label>
      <input id="fMobile" class="fi req-f" type="tel" placeholder="01012345678 (하이픈 없이)" value="${esc(r?.mobile||'')}" oninput="fmtPhone(this)">
    </div>

    <div class="fg">
      <label class="fl">입식 여부</label>
      <div class="toggle-row">
        <button class="tgl ${formState.tableSeating?'on':''}" id="tblY" onclick="setTgl('table',true)">🪑 입식 (테이블)</button>
        <button class="tgl ${!formState.tableSeating?'on':''}" id="tblN" onclick="setTgl('table',false)">🍃 좌식 (바닥)</button>
      </div>
    </div>

    <div class="fg">
      <label class="fl">단독룸 여부</label>
      <div class="toggle-row">
        <button class="tgl ${formState.privateRoom?'on':''}" id="rmY" onclick="setTgl('room',true)">✅ 있음</button>
        <button class="tgl ${!formState.privateRoom?'on':''}" id="rmN" onclick="setTgl('room',false)">❌ 없음</button>
      </div>
    </div>

    <div class="fg">
      <label class="fl">최대 수용 인원</label>
      <input id="fCap" class="fi" type="number" inputmode="numeric" placeholder="명 (숫자만)" min="1" max="9999" value="${r?.maxCapacity||''}">
    </div>

    <div class="fg">
      <label class="fl">메모</label>
      <textarea id="fMemo" class="fta" lang="ko" rows="3" placeholder="추천 메뉴, 주차, 특이사항 등...">${esc(r?.memo||'')}</textarea>
    </div>

    <button class="btn-save" onclick="submitForm()">${isEdit ? '수정 완료' : '추가하기'}</button>
    <button class="btn-cancel" onclick="closeFormBtn()">취소</button>
  `;
}

function setTgl(type, val) {
  if (type === 'table') {
    formState.tableSeating = val;
    document.getElementById('tblY').classList.toggle('on', val);
    document.getElementById('tblN').classList.toggle('on', !val);
  } else {
    formState.privateRoom = val;
    document.getElementById('rmY').classList.toggle('on', val);
    document.getElementById('rmN').classList.toggle('on', !val);
  }
}

function submitForm() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('식당 이름을 입력해주세요.'); return; }

  const cap = parseInt(document.getElementById('fCap').value) || 0;
  const data = {
    id: editId || uid(),
    name,
    foodType: document.getElementById('fFood').value,
    province: document.getElementById('fProv').value.trim(),
    city: document.getElementById('fCity').value.trim(),
    district: document.getElementById('fDist').value.trim(),
    address: document.getElementById('fAddr').value.trim(),
    addressUrl: document.getElementById('fUrl').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    mobile: document.getElementById('fMobile').value.trim(),
    hasTableSeating: formState.tableSeating,
    hasPrivateRoom: formState.privateRoom,
    maxCapacity: cap,
    memo: document.getElementById('fMemo').value.trim(),
  };

  if (editId) {
    const idx = DB.findIndex(r => r.id === editId);
    DB[idx] = data;
  } else {
    DB.push(data);
  }

  persist();
  closeFormBtn();
  if (showRegion) buildRegionDropdowns();
  render();
}

// ── SETTINGS ──────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('settKey').value = localStorage.getItem('kakao_js_key') || '';
  document.getElementById('settOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSett(e) {
  if (!e || e.target === document.getElementById('settOverlay')) closeSettBtn();
}
function closeSettBtn() {
  document.getElementById('settOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function saveSettings() {
  const key = document.getElementById('settKey').value.trim();
  localStorage.setItem('kakao_js_key', key);
  sdkReady = false; sdkPromise = null;
  closeSettBtn();
  alert(key ? '✅ API 키가 저장됐어요!' : '🗑️ API 키가 삭제됐어요.');
}

// ── KAKAO SDK ─────────────────────────────────────────────────────
let sdkReady = false, sdkPromise = null;

function loadSdk() {
  const key = localStorage.getItem('kakao_js_key') || '';
  if (!key) return Promise.reject(new Error('⚙️ 설정에서 카카오 JavaScript API 키를 먼저 등록해주세요.'));
  if (sdkReady) return Promise.resolve();
  if (sdkPromise) return sdkPromise;
  sdkPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
    s.onload = () => kakao.maps.load(() => { sdkReady = true; res(); });
    s.onerror = () => { sdkPromise = null; rej(new Error('SDK 로드 실패 — API 키와 플랫폼 도메인 등록을 확인해주세요.')); };
    document.head.appendChild(s);
  });
  return sdkPromise;
}

// ── URL PARSE ─────────────────────────────────────────────────────
function parseKakaoUrl(url) {
  url = (url || '').trim();
  // https://map.kakao.com/link/map/NAME,lat,lng
  const m = url.match(/link\/map\/(.+?),([\d.]+),([\d.]+)/);
  if (m) return { name: decodeURIComponent(m[1].replace(/\+/g, ' ')), lat: +m[2], lng: +m[3] };
  // https://place.map.kakao.com/ID
  const p = url.match(/place\.map\.kakao\.com\/(\d+)/);
  if (p) return { placeId: p[1] };
  return null;
}

// ── IMPORT FROM URL ───────────────────────────────────────────────
async function importUrl() {
  const urlVal = (document.getElementById('fUrl').value || '').trim();
  const stEl = document.getElementById('importStatus');
  const st = (msg, color) => { stEl.textContent = msg; stEl.style.color = color; };

  if (!urlVal) { st('⚠️ URL을 먼저 붙여넣어 주세요.', '#C62828'); return; }

  const parsed = parseKakaoUrl(urlVal);
  if (!parsed) { st('⚠️ 카카오맵 URL이 아닌 것 같아요.', '#C62828'); return; }

  const apiKey = localStorage.getItem('kakao_js_key') || '';
  if (!apiKey) {
    if (parsed.name) {
      document.getElementById('fName').value = parsed.name;
      st(`✅ 이름 "${parsed.name}" 만 입력됐어요. 전체 자동입력은 ⚙️ 설정에서 API 키를 등록하세요.`, '#E65100');
    } else {
      st('📍 URL 저장됨. 전체 자동입력을 원하면 ⚙️ 설정에서 카카오 API 키를 등록하세요.', '#1565C0');
    }
    return;
  }

  st('🔍 검색 중...', '#999');

  try {
    await loadSdk();
    const ps = new kakao.maps.services.Places();
    const query = parsed.name || document.getElementById('fName').value.trim();

    if (!query) {
      st('⚠️ 이름이 포함된 URL을 붙여넣거나, 이름 항목을 먼저 입력해주세요.', '#C62828');
      return;
    }

    const opts = {};
    if (parsed.lat && parsed.lng) {
      opts.location = new kakao.maps.LatLng(parsed.lat, parsed.lng);
      opts.radius = 300;
      opts.sort = kakao.maps.services.SortBy.DISTANCE;
    }

    ps.keywordSearch(query, (results, status) => {
      if (status !== kakao.maps.services.Status.OK || !results.length) {
        st('⚠️ 검색 결과가 없어요. 이름을 직접 수정 후 다시 시도해보세요.', '#C62828');
        return;
      }
      fillFromPlace(results[0]);
      st(`✅ "${results[0].place_name}" 정보를 불러왔어요! 확인 후 저장하세요.`, '#2E7D32');
    }, opts);

  } catch(e) {
    st('❌ ' + e.message, '#C62828');
  }
}

function fillFromPlace(p) {
  if (p.place_name) document.getElementById('fName').value = p.place_name;
  const addr = p.road_address_name || p.address_name;
  if (addr) document.getElementById('fAddr').value = addr;
  if (p.phone) document.getElementById('fPhone').value = p.phone;
  if (p.place_url) document.getElementById('fUrl').value = p.place_url;
  const ft = mapCat(p.category_name);
  if (ft) document.getElementById('fFood').value = ft;
  if (p.address_name) {
    const { prov, city, dist } = splitAddr(p.address_name);
    if (prov) document.getElementById('fProv').value = prov;
    if (city) document.getElementById('fCity').value = city;
    if (dist) document.getElementById('fDist').value = dist;
  }
}

function mapCat(c) {
  c = c || '';
  if (/한식|국밥|설렁탕|삼겹살|갈비|불고기|한정식|찌개|순두부|비빔|백반|쌈/.test(c)) return '한식';
  if (/중식|중국|짜장|짬뽕|탕수육|마라/.test(c)) return '중식';
  if (/일식|스시|초밥|라멘|우동|소바|돈까스|돈가스|이자카야|야키토리/.test(c)) return '일식';
  if (/양식|이탈리아|피자|파스타|스테이크|버거|패밀리레스토랑|서양|프랑스/.test(c)) return '양식';
  if (/분식|떡볶이|김밥|순대|포장마차|튀김/.test(c)) return '분식';
  return '';
}

function splitAddr(addr) {
  const abbr = {
    '서울':'서울특별시','부산':'부산광역시','대구':'대구광역시','인천':'인천광역시',
    '광주':'광주광역시','대전':'대전광역시','울산':'울산광역시','세종':'세종특별자치시',
    '경기':'경기도','강원':'강원도','충북':'충청북도','충남':'충청남도',
    '전북':'전라북도','전남':'전라남도','경북':'경상북도','경남':'경상남도','제주':'제주도'
  };
  const parts = addr.split(' ').filter(Boolean);
  let prov = '', city = '', dist = '';
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (!prov && abbr[p]) { prov = abbr[p]; continue; }
    if (!prov && /특별시$|광역시$|특별자치시$|도$|특별자치도$/.test(p)) { prov = p; continue; }
    if (prov && !city && /시$|군$|구$/.test(p)) { city = p; continue; }
    if (city && /구$/.test(p)) { dist = p; continue; }
    if (city && /동$|읍$|면$/.test(p)) { dist = p; break; }
  }
  return { prov, city, dist };
}

// ── 전화번호 하이픈 자동 포맷 ─────────────────────────────────────
function fmtPhone(el) {
  const n = el.value.replace(/\D/g, '').slice(0, 11);
  let r = '';
  if (n.startsWith('02')) {
    if (n.length <= 2) r = n;
    else if (n.length <= 5) r = n.slice(0,2)+'-'+n.slice(2);
    else if (n.length <= 9) r = n.slice(0,2)+'-'+n.slice(2,5)+'-'+n.slice(5);
    else r = n.slice(0,2)+'-'+n.slice(2,6)+'-'+n.slice(6);
  } else if (n.startsWith('010')) {
    if (n.length <= 3) r = n;
    else if (n.length <= 7) r = n.slice(0,3)+'-'+n.slice(3);
    else r = n.slice(0,3)+'-'+n.slice(3,7)+'-'+n.slice(7);
  } else {
    if (n.length <= 3) r = n;
    else if (n.length <= 6) r = n.slice(0,3)+'-'+n.slice(3);
    else if (n.length <= 10) r = n.slice(0,3)+'-'+n.slice(3,6)+'-'+n.slice(6);
    else r = n.slice(0,3)+'-'+n.slice(3,7)+'-'+n.slice(7);
  }
  el.value = r;
}

// ── 데이터 내보내기 ────────────────────────────────────────────────
async function exportHTML() {
  const currentDB = JSON.parse(localStorage.getItem('matjib_v1') || 'null') || DB;
  if (!confirm(`현재 저장된 맛집 ${currentDB.length}개를 파일에 포함해서 다운로드합니다.\n계속하시겠어요?`)) return;
  try {
    let html;

    // localhost에서는 fetch (캐시 무시), file://에서는 DOM 직렬화
    try {
      const res = await fetch('./index.html?v=' + Date.now(), { cache: 'no-cache' });
      if (res.ok) html = await res.text();
    } catch {}

    if (!html) {
      html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    }

    const dataStr = JSON.stringify(currentDB);
    // const _emb = [...] 형식과 기존 let DB = [...] 형식 모두 처리
    let replaced = html.replace(
      /const _emb = \[[\s\S]*?\];/,
      `const _emb = ${dataStr};`
    );
    if (replaced === html) {
      replaced = html.replace(
        /let DB = (?:JSON\.parse\(localStorage\.getItem\('matjib_v1'\) \|\| 'null'\) \|\| )?\[[\s\S]*?\];/,
        `let DB = ${dataStr};`
      );
    }

    const blob = new Blob([replaced], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'index.html'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    alert(`✅ 완료! 맛집 ${currentDB.length}개 데이터가 포함된 index.html 다운로드됐어요.`);
  } catch(e) { alert('❌ ' + e.message); }
}

// ── INIT ──────────────────────────────────────────────────────────
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
